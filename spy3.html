<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>SPY3 Live Dashboard | SINTRO</title>
    <style>
      /* Grundlegendes Layout und Reset */
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden; /* Verhindert Scrollen der gesamten Seite */
          display: flex;
          flex-direction: column;
      }
      iframe {
          width: 100vw;
          height: calc(100vh - 200px); /* Gesamthöhe minus Header */
          border: none;
          display: block; /* Entfernt mögliche Inline-Spaces */
      }
    </style>
  </head>
  <body>
  <header class="spy3_header">
      SPY3 Live Dashboard
  </header>
  <main class="spy3_content-section">
    <iframe
      src="https://sintro-spy3-092395c95288.herokuapp.com/"
      allowfullscreen>
    </iframe>
  </main>
  <footer class="spy3_footer">
      <p>Copyright © SINTRO Asset Management GmbH - All Rights Reserved</p>
  </footer>
  </body>
</html>
