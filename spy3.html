<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>SPY3 Live Dashboard | SINTRO</title>
    <style>
      /* Grundlegende Reset- und Layout-Stile */
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: hidden; /* Kein Scrollen des gesamten Dokuments */
          display: flex;
          flex-direction: column;
      }

      header {
          background-image: url('assets/header.jpg');
          background-size: cover;
          background-position: center;
          height: 200px;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: Arial, sans-serif;
          font-size: 24px;
          font-weight: bold;
          text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      }

      iframe {
          flex-grow: 1; /* Nimmt den gesamten restlichen Platz ein */
          width: 100%;
          height: calc(100vh - 200px); /* Gesamthöhe minus Header */
          border: none;
      }
    </style>
  </head>
  <body>
    <header>SPY3 Live Dashboard</header>
    <iframe
        src="https://sintro-spy3-092395c95288.herokuapp.com/"
        scrolling="no"
        allowfullscreen>
    </iframe>
  </body>
</html>
