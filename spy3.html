<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>SPY3 Live Dashboard  | SINTRO </title>
    <style>
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          display: flex;
          flex-direction: column;
      }

      header {
          background-image: url('assets/header.jpg');
          background-size: cover;
          background-position: center;
          height: 200px;
          width: 100%;
      }

      iframe {
          flex-grow: 1; /* Nimmt den restlichen Platz ein */
          width: 100%;
          height: calc(100vh - 200px); /* Gesamthöhe minus Header */
          border: none;
          overflow: hidden; /* Verhindert Scrollen innerhalb des Iframes */
      }

      /* Stellt sicher, dass der gesamte Inhalt auf der Website scrollt */
      body {
          overflow: auto;
      }
  </style>
  </head>
<body> 
    <main class="content-section">
        <h1>Explore Our Application</h1>

            src="https://sintro-spy3-092395c95288.herokuapp.com/"
            width="100%"
            height="800px"
            frameborder="0"
            style="border: none;"
            allowfullscreen>
        </iframe>
    </main>
    <footer>
            <p>SINTRO Asset Management GmbH - All Rights Reserved</p>
        </footer>
  </body>
</html>
