<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>SPY3 Live Dashboard | SINTRO</title>
    <style>
      /* Grundlegendes Layout und Reset */
      body, html {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: auto; /* Ermöglicht Scrollen auf der Webseite */
          display: flex;
          flex-direction: column;
      }

      header {
          background-image: url('assets/header.jpg');
          background-size: cover;
          background-position: center;
          height: 200px;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-family: Arial, sans-serif;
          font-size: 24px;
          font-weight: bold;
          text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
      }

      section {
          flex-grow: 1; /* Lässt die Sektion wachsen */
          width: 100%;
          height: calc(100vh - 200px); /* Gesamthöhe minus Header */
      }

      iframe {
          width: 100%;
          height: 100%; /* Iframe füllt die gesamte Sektion aus */
          border: none;
      }
    </style>
  </head>
  <body>
    <header>SPY3 Live Dashboard</header>
    <section>
        <iframe
            src="https://sintro-spy3-092395c95288.herokuapp.com/"
            allowfullscreen>
        </iframe>
    </section>
  </body>
</html>
